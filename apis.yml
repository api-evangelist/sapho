name: Sapho
description: Sapho was a San Bruno, California micro-apps startup (founded 2014) that let enterprises
  build employee-facing "micro apps" and workflow notifications on top of legacy and SaaS systems. It
  was acquired by Citrix in November 2018 and folded into the Citrix Workspace product line as Citrix
  Microapps; the standalone product, developer portal, and any API surface were retired. The sapho.com
  domain now resolves only to a MarkMonitor brand-protection holding page (HTTPS refused, HTTP returns
  the registrar notice), so there is no live public API, documentation, or developer surface to enrich.
  This record is retained as a portfolio-company history stub for bloomberg-beta and uncork-capital.
